<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>
    <title>World Clock - Faith Akiror</title>
</head>
<body>
    <div class="container">
        <h1>World Clock </h1>

        <select id="city">
            <option value="">Select a city...</option>
            <option value="America/New_York">New York, USA</option>
            <option value="Europe/London">London, United Kingdom</option>
            <option value="Asia/Tokyo">Tokyo, Japan</option>
            <option value="Africa/Kampala">Kampala, Uganda</option>
            <option value="Australia/Sydney">Sydney, Australia</option>
            <option value="Africa/Johannesburg">Johannesburg, South Africa</option>
            <option value="America/Los_Angeles">Los Angeles, USA</option>
            <option value="Asia/Dubai">Dubai, UAE</option>
            <option value="Europe/Paris">Paris, France</option>
            <option value="Asia/Hong_Kong">Hong Kong, China</option>
            <option value="America/Sao_Paulo">Sao Paulo, Brazil</option>
        </select>

        <div id="cities"></div>

    </div>
    <footer> This project was coded with ❤️ by <strong>Faith Akiror</strong> and is <a href="https://github.com/faith-akiror/world-clock.git" target="_blank"> open sourced on GitHub </a>. </footer>
    <script src="javascript/index.js"></script>
</body>
</html>
