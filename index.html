<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <title>World Clock - Faith Akiror</title>
</head>
<body>
    <div class="container">
        <h1>World Clock </h1>

        <select>
            <option value="">Select a city...</option>
            <option value="New York">New York</option>
            <option value="London">London</option>
            <option value="Tokyo">Tokyo</option>
        </select>

        <div class="city">
            <div>
            <h2>Los Angels </h2>
            <div class="date">August 15th 2026</div>
            </div>
            <div class="time">12:00
                <small>PM</small>
            </div>
        </div>
        <div class="city">
            <div>
            <h2>London</h2>
            <div class="date">August 15th 2026</div>
            </div>
            <div class="time">1:48
                <small>PM</small>
            </div>
        </div>

    </div>
    <footer> This project was coded with ❤️ by <strong>Faith Akiror</strong> and is <a href="https://github.com/faith-akiror/world-clock.git" target="_blank"> open sourced on GitHub </a>. </footer>
    <script src="javascript/index.js"></script>
</body>
</html>
