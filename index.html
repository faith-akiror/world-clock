<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>
    <title>World Clock - Faith Akiror</title>
</head>
<body>
    <div class="container">
        <h1>World Clock </h1>

        <select id="city">
            <option value="">Select a city...</option>
            <option value="America/New_York">New York</option>
            <option value="Europe/London">London</option>
            <option value="Asia/Tokyo">Tokyo</option>
            <option value="Africa/Kampala">Kampala</option>
            <option value="Australia/Sydney">Sydney</option>
            <option value="Africa/Johannesburg">Johannesburg</option>
            <option value="America/Los_Angeles">Los Angeles</option>
            <option value="Asia/Dubai">Dubai</option>
            <option value="Europe/Paris">Paris</option>
            <option value="Asia/Hong_Kong">Hong Kong</option>
            <option value="America/Sao_Paulo">Sao Paulo</option>
        </select>

        <div id="cities">
         <div class="city" id="los">
            <div>
            <h2>Los Angels </h2>
            <div class="date"></div>
            </div>
            <div class="time">
            </div>
         </div>
         <div class="city" id="lod">
            <div>
            <h2>London</h2>
            <div class="date"></div>
            </div>
            <div class="time">
            </div>
         </div>
        </div>

    </div>
    <footer> This project was coded with ❤️ by <strong>Faith Akiror</strong> and is <a href="https://github.com/faith-akiror/world-clock.git" target="_blank"> open sourced on GitHub </a>. </footer>
    <script src="javascript/index.js"></script>
</body>
</html>
